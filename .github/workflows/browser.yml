name: Browser acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
          - os: ubuntu-latest
            browser: firefox
          - os: ubuntu-latest
            browser: webkit
          - os: windows-latest
            browser: chromium
    runs-on: ${{ matrix.os }}
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - if: runner.os == 'Linux'
        run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
      - if: runner.os == 'Windows'
        run: npx --no-install playwright install ${{ matrix.browser }}
      - run: npm run test:browser -- --project=${{ matrix.browser }}
